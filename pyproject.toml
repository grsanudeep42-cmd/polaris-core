[tool.poetry]
name = "polaris-core"
version = "1.0.0"
description = "Reusable backend infrastructure core"
authors = ["Anudeep"]
packages = [
    { include = "polaris" }
]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
fastapi = "^0.128.8"
uvicorn = {extras = ["standard"], version = "^0.40.0"}
sqlalchemy = "^2.0.46"
asyncpg = "^0.31.0"
alembic = "^1.18.4"
pydantic = "^2.12.5"
pydantic-settings = "^2.12.0"
python-jose = "^3.5.0"
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-multipart = "^0.0.22"
psycopg2-binary = "^2.9.11"

[tool.poetry.group.dev.dependencies]
black = "^26.1.0"
isort = "^7.0.0"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
